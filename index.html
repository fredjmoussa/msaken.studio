<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MSAKEN.STUDIO</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #000000;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 3rem 1.5rem;
      text-align: center;
    }

    /* Top badge */
    .status {
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.25em;
      color: #888888;
    }

    /* Main Content */
    main {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      max-width: 900px;
      margin: my-auto;
    }

    h1 {
      font-size: clamp(2.5rem, 8vw, 6rem);
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      margin-bottom: 1.5rem;
      line-height: 1;
    }

    p.subtitle {
      font-size: clamp(1rem, 2vw, 1.35rem);
      font-weight: 300;
      letter-spacing: 0.05em;
      line-height: 1.6;
      color: #cccccc;
      max-width: 750px;
    }

    /* Footer / Contact */
    footer {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      font-size: 0.95rem;
      letter-spacing: 0.05em;
    }

    footer a {
      color: #ffffff;
      text-decoration: none;
      border-bottom: 1px solid #444444;
      padding-bottom: 2px;
      transition: border-color 0.2s ease, color 0.2s ease;
    }

    footer a:hover {
      color: #888888;
      border-color: #888888;
    }
  </style>
</head>
<body>

  <div class="status">Coming Soon</div>

  <main>
    <h1>MSAKEN.STUDIO</h1>
    <p class="subtitle">
      An independent film production, post-production and distribution platform in Tunisia.
    </p>
  </main>

  <footer>
    <a href="mailto:fredjmoussastudio@gmail.com">contact@msaken.studio</a>
  </footer>

</body>
</html>
